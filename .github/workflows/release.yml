name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Package skill
        run: |
          mkdir -p dist
          zip -r dist/html-pdf.skill . -x ".git/*" "dist/*" "*.pyc" "__pycache__/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/html-pdf.skill
          generate_release_notes: true
